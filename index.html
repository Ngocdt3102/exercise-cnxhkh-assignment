<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn thi CNXHKH | Ngoc.dev</title>
    <!-- Font hiện đại Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background trang trí -->
    <div class="bg-shapes"></div>

    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-code"></i> Ngoc<span>.dev</span>
            </div>
            <div class="course-badge">
                <i class="fa-solid fa-graduation-cap"></i> CNXHKH
            </div>
        </header>

        <main class="main-content">
            <!-- MÀN HÌNH SETUP -->
            <section id="setup-screen" class="glass-card active">
                <div class="icon-wrapper"><i class="fa-solid fa-book-open-reader"></i></div>
                <h2 class="title">Hệ thống Trắc nghiệm</h2>
                <p class="subtitle">Khởi động hành trình ôn thi với ngân hàng 200 câu hỏi chuẩn đầu ra.</p>
                
                <div class="form-group">
                    <label for="chapter-select"><i class="fa-solid fa-layer-group"></i> Chọn phạm vi ôn tập:</label>
                    <div class="select-wrapper">
                        <select id="chapter-select">
                            <option value="all">🔥 Toàn bộ 200 câu (Trộn ngẫu nhiên)</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-icon"></i>
                    </div>
                </div>
                
                <button id="start-btn" class="btn btn-primary btn-glow">
                    <span>Bắt đầu làm bài</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </section>

            <!-- MÀN HÌNH LÀM BÀI -->
            <section id="quiz-screen" class="glass-card hidden">
                <div class="quiz-top-bar">
                    <div class="question-tracker">
                        <span class="label">Câu hỏi</span>
                        <span class="numbers"><strong id="current-q-num">1</strong> / <span id="total-q-num">200</span></span>
                    </div>
                    <div class="score-tracker">
                        <i class="fa-solid fa-trophy"></i> Điểm: <strong id="score-display">0</strong>
                    </div>
                </div>
                
                <div class="progress-container">
                    <div id="progress-fill"></div>
                </div>

                <div class="question-container">
                    <h3 id="question-text">Đang tải câu hỏi...</h3>
                </div>
                
                <div id="options-container" class="options-grid">
                    <!-- Nút đáp án render từ JS -->
                </div>

                <div class="quiz-footer">
                    <button id="next-btn" class="btn btn-next hidden">
                        Tiếp theo <i class="fa-solid fa-angle-right"></i>
                    </button>
                </div>
            </section>

            <!-- MÀN HÌNH KẾT QUẢ -->
            <section id="result-screen" class="glass-card hidden">
                <div class="icon-wrapper trophy-icon"><i class="fa-solid fa-medal"></i></div>
                <h2 class="title">Hoàn thành bài thi!</h2>
                
                <div class="score-display-wrapper">
                    <div class="score-circle">
                        <div class="score-content">
                            <span id="final-score" class="score-big">0</span>
                            <span class="score-divider">/</span>
                            <span id="final-total" class="score-small">0</span>
                        </div>
                    </div>
                </div>

                <p id="feedback-msg" class="feedback-msg"></p>
                
                <button id="restart-btn" class="btn btn-primary btn-glow">
                    <i class="fa-solid fa-rotate-right"></i> Làm lại từ đầu
                </button>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
